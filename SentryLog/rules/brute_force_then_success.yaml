name: brute_force_then_success
type: correlation
severity: critical
description: SSH brute force followed by successful login — likely credential compromise
mitre_tags:
  - "T1110"
  - "T1110.001"
  - "T1078"
conditions: []
group_by: source_ip
correlation_window: 600
sequence:
  - conditions:
      - field: action
        operator: equals
        value: auth_failure
  - conditions:
      - field: action
        operator: equals
        value: auth_success
